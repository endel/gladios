# /etc/nginx/snippets/gladios.conf
#
# Include inside a `server { }` to check every location in it. Leave one out with
# `auth_request off;` inside it, or skip requests by any variable with $gladios_bypass
# (/etc/gladios/settings.conf).
#
# Gotcha: a location with an error_page of its own no longer inherits the one here, so add
# `error_page 401 = /.gladios/page;` to it as well.

include snippets/gladios-server.conf;

auth_request /.gladios/auth;
error_page 401 = /.gladios/page;
