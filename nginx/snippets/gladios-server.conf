# /etc/nginx/snippets/gladios-server.conf
#
# Include inside each protected `server { }`, then include snippets/gladios-protect.conf in the
# locations to check. Needs conf.d/gladios.conf.
#
# A request without a pass-shaped cookie gets the challenge page straight from disk: a flood costs no
# more than a static file. Only a cookie shaped like a pass costs an HMAC (njs, in nginx itself).
#
# `^~` keeps these ahead of regex locations (a `location ~ /\.` that denies dotfiles, say).

location ^~ /.gladios/ {
    alias /opt/gladios/public/;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Your own page and its assets (README.md, "Your own page"). Kept out of /opt/gladios, so
# upgrades never overwrite it.
location ^~ /.gladios/site/ {
    alias /etc/gladios/site/;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# The mascot: yours from /etc/gladios/site if there's one there, else the default. Its own CSP, so
# an SVG opened directly can't run scripts on your origin.
location = /.gladios/mascot {
    root /etc/gladios/site;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    try_files /mascot.webp /mascot.png /mascot.svg /mascot.jpg /mascot.gif @gladios_default_mascot;
}

location @gladios_default_mascot {
    root /opt/gladios/public;
    access_log off;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    try_files /gladios.webp =404;
}

location = /.gladios/api/challenge {
    limit_req zone=gladios burst=30 nodelay;
    limit_req_status 429;
    js_content gladios.challenge;
}

location = /.gladios/api/verify {
    limit_req zone=gladios burst=30 nodelay;
    limit_req_status 429;
    # njs only sees a body held in memory
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    js_content gladios.verify;
}

# auth_request's target. Each `if` stops at the first answer, so the HMAC (njs) only runs for a
# checked request whose cookie is shaped like a pass.
location = /.gladios/auth {
    internal;
    if ($gladios_gate = 0) { return 204; }
    if ($gladios_pass_shaped = 0) { return 401; }
    if ($gladios_pass_valid = 0) { return 401; }
    return 204;
}

# The challenge page, served in place of whatever was asked for (status 200): once solved, the page
# reloads that same URL. A URI, not a named location: error_page turns the redirect into a GET,
# so a POST gets the page too instead of the static handler's 405. Logged apart, so a flood stays
# out of the main access log; strikes (conf.d/gladios.conf) also go to gladios-strikes.log.
location = /.gladios/page {
    internal;
    root /etc/gladios/site;
    access_log /var/log/nginx/gladios.log combined;
    access_log /var/log/nginx/gladios-strikes.log gladios_strike if=$gladios_strike;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html @gladios_default_page;
}

location @gladios_default_page {
    root /opt/gladios/public;
    access_log /var/log/nginx/gladios.log combined;
    access_log /var/log/nginx/gladios-strikes.log gladios_strike if=$gladios_strike;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =503;
}
