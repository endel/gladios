# /etc/nginx/snippets/gladios-protect.conf
#
# Include inside each location to check (see snippets/gladios-server.conf).
#
# Gotcha: an error_page here replaces every error_page the location would otherwise inherit from
# its server block. Repeat any you rely on.

auth_request /.gladios/auth;
error_page 401 = /.gladios/page;
