# /etc/gladios/settings.conf
#
# Who gets checked, and how. install.sh writes this file once and never touches it again: it's
# yours. Read at http level by conf.d/gladios.conf. Apply: nginx -t && systemctl reload nginx

# 1 checks visitors; 0 lets everyone straight through
map $host $gladios_enabled {
    default 1;
}

# 1 never checks: anything that can't run a browser, such as API clients, webhooks, uptime checks
# and your own servers. Any variable works: a path, a header, an address from a `geo` block.
map $request_uri $gladios_bypass {
    default          0;
    ~^/\.well-known/ 1;    # ACME (Let's Encrypt) and other files machines fetch
    # ~^/api/        1;
}

# The pass cookie: any name, the same on both lines
map $host $gladios_cookie_name {
    default gladios;
}
map $host $gladios_cookie {
    default $cookie_gladios;
}

# Optional, shown at their defaults:
# map $host $gladios_difficulty    { default 16; }           # leading zero bits; each +1 doubles the work
# map $host $gladios_pass_ttl      { default 604800; }       # seconds a pass lasts
# map $host $gladios_cookie_domain { default example.com; }  # one pass for every host under it
