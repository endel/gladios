# /etc/nginx/conf.d/gladios.conf
#
# http-level half of the browser check (snippets/gladios-server.conf has the locations). Needs
# nginx's njs module loaded, /etc/gladios/secret.conf and /etc/gladios/settings.conf: install.sh
# sees to all three.
#
# settings.conf defines:
#   $gladios_enabled      1 to check (an on/off switch)
#   $gladios_bypass       1 for requests that must never be checked: signed-in users, API clients,
#                         webhooks, health checks
#   $gladios_cookie_name  the pass cookie's name
#   $gladios_cookie       its value, $cookie_<the same name>
# and optionally $gladios_difficulty, $gladios_pass_ttl, $gladios_cookie_domain (README.md).
#
# Apply: `nginx -t && systemctl reload nginx`

js_import gladios from /opt/gladios/njs/gladios.js;

# `js_var $gladios_secret "...";`, root-only: nginx reads its config as root, so the workers get
# the secret without being able to read the file
include /etc/gladios/secret.conf;

include /etc/gladios/settings.conf;

# "1" when the pass cookie checks out; only evaluated for a pass-shaped cookie
js_set $gladios_pass_valid gladios.passValid;

map "$gladios_enabled:$gladios_bypass" $gladios_gate {
    "1:0"   1;
    default 0;
}

# Only a cookie shaped like a pass (expires.HMAC) is worth an HMAC
map $gladios_cookie $gladios_pass_shaped {
    "~^[0-9]{1,12}\.[A-Za-z0-9_-]{43}$" 1;
    default 0;
}

# A strike: came with a pass cookie and still got the challenge (forged, expired, or solved on
# another network). A real browser makes one and then solves; a flood with forged cookies makes
# one per request. Logged to gladios-strikes.log for fail2ban (fail2ban/filter.d/gladios.conf).
map $gladios_cookie $gladios_strike {
    ""      0;
    default 1;
}
log_format gladios_strike '$time_iso8601 strike $remote_addr $host "$request_method $request_uri" "$http_user_agent"';

# /.gladios/api/*: 2 requests per check, so this is ~30 checks a minute per address, room for an
# office or a carrier NAT behind one IP. Each costs a hash and an HMAC. Its 429s are limit_req
# errors in error.log like any other zone's, for fail2ban to act on.
limit_req_zone $binary_remote_addr zone=gladios:10m rate=60r/m;
