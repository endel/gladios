# /etc/nginx/conf.d/gladios.conf
#
# http-level half of the browser check (snippets/gladios-server.conf has the locations).
#
# The deployment defines, in its own http-level config:
#   $gladios_enabled  1 to check (an on/off switch, e.g. `map $host $gladios_enabled { default 1; }`)
#   $gladios_bypass   1 for requests that must never be checked: signed-in users, API clients,
#                     webhooks, health checks
#   upstream gladios_php  the php-fpm pool running /opt/gladios/src/fcgi.php
#
# Apply: `nginx -t && systemctl reload nginx`

map "$gladios_enabled:$gladios_bypass" $gladios_gate {
    "1:0"   1;
    default 0;
}

# /.gladios/api/*: 2 requests per check, so this is ~30 checks a minute per address, room for an
# office or a carrier NAT behind one IP. Each costs a hash and an HMAC. Its 429s are limit_req
# errors in error.log like any other zone's, for fail2ban to act on.
limit_req_zone $binary_remote_addr zone=gladios:10m rate=60r/m;
