# The worked example, and what test/e2e runs, with test/e2e/settings.conf: an app on sibling hosts,
# checked as a whole server (a, b) or in one location (c).

server {
    listen 443 ssl;
    server_name a.gladios.test b.gladios.test;
    ssl_certificate     /etc/ssl/gladios-test/cert.pem;
    ssl_certificate_key /etc/ssl/gladios-test/key.pem;
    root /var/www/app;

    include snippets/gladios.conf;

    location / {
        try_files $uri /index.html;
    }

    # alias, not try_files: a fallback to /index.html would land back in a checked location
    location /open/ {
        auth_request off;
        alias /var/www/app/;
    }
}

server {
    listen 443 ssl;
    server_name c.gladios.test;
    ssl_certificate     /etc/ssl/gladios-test/cert.pem;
    ssl_certificate_key /etc/ssl/gladios-test/key.pem;
    root /var/www/app;

    include snippets/gladios-server.conf;

    location / {
        try_files $uri /index.html;
    }

    location /members/ {
        include snippets/gladios-protect.conf;
        try_files $uri /index.html;
    }
}
