# The worked example, and what test/e2e runs: an app on two sibling hosts sharing one pass
# (GLADIOS_COOKIE_DOMAIN=gladios.test), behind the check, with the bypasses most sites need.

upstream gladios_php {
    server unix:/run/php/gladios.sock;
}

# the switch: 1 checks, 0 lets everyone straight through
map $host $gladios_enabled {
    default 1;
}

# the pass cookie: any name, the same on both lines
map $host $gladios_cookie_name {
    default gate;
}
map $host $gladios_cookie {
    default $cookie_gate;
}

# never checked: API clients (no browser to solve with) and the host itself (health checks)
geo $gladios_local {
    default     0;
    127.0.0.0/8 1;
    ::1         1;
}
map "$gladios_local $request_uri" $gladios_bypass {
    default     0;
    "~^1 "      1;
    "~^0 /api/" 1;
}

server {
    listen 443 ssl;
    server_name a.gladios.test b.gladios.test;
    ssl_certificate     /etc/ssl/gladios-test/cert.pem;
    ssl_certificate_key /etc/ssl/gladios-test/key.pem;
    root /var/www/app;

    include snippets/gladios-server.conf;

    location / {
        include snippets/gladios-protect.conf;
        try_files $uri /index.html;
    }
}
