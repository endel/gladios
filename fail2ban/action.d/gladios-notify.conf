# /etc/fail2ban/action.d/gladios-notify.conf
#
# Records each ban for bin/gladios-notify, which posts a digest to a webhook from cron. Only a file
# append here: during a flood fail2ban bans hundreds of addresses a minute, and a network call per
# ban would slow every one of them. Add it to any jail, next to the action that bans:
#
#   action = %(action_)s
#            gladios-notify[name=%(__name__)s]

[Definition]
# a restart re-applies the bans it remembers: they were reported when they happened
norestored = 1
actionstart = mkdir -p /var/log/gladios
actionban = printf '%%s %%s %%s %%s\n' "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" "<name>" "<ip>" "<failures>" >> /var/log/gladios/bans.log
actionunban =
actionstop =
actioncheck =
