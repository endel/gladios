# /etc/fail2ban/filter.d/gladios.conf
#
# Strikes in /var/log/nginx/gladios-strikes.log (log_format gladios_strike, nginx/conf.d/gladios.conf):
# an address that came with a pass cookie and still got the challenge. A real browser makes one,
# after its pass expires or it changes network, and then solves.
#
#   fail2ban-regex /var/log/nginx/gladios-strikes.log gladios

[Definition]
# fail2ban cuts the timestamp out before matching
failregex = ^\s*strike <HOST> \S+ "
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
