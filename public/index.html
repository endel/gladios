<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checking your browser</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: oklch(0.982 0.002 260);
    --fg: oklch(0.215 0.012 260);
    --muted: oklch(0.515 0.014 260);
    --primary: oklch(0.32 0.02 260);
    --primary-fg: #fff;
    --track: oklch(0.9 0.006 260);
    --danger: oklch(0.55 0.2 27);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.2 0.008 260);
      --fg: oklch(0.935 0.004 260);
      --muted: oklch(0.74 0.012 260);
      --primary: oklch(0.88 0.008 260);
      --primary-fg: oklch(0.2 0.008 260);
      --track: oklch(0.34 0.01 260);
      --danger: oklch(0.72 0.17 27);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  img { display: block; width: auto; height: auto; max-width: 220px; max-height: 260px; margin: 0 auto 8px; }
  h1 { margin: 0 0 6px; font-size: 1.375rem; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 24px;
    margin-top: 20px;
    font-size: 0.9375rem;
  }
  .spinner {
    width: 16px;
    height: 16px;
    flex: none;
    border: 2px solid var(--track);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .failed .spinner { display: none; }
  .failed #status { color: var(--danger); }
  button {
    display: none;
    margin: 16px auto 0;
    padding: 8px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: var(--primary-fg);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .failed button.retry { display: block; }
  noscript p { margin-top: 20px; color: var(--danger); }
</style>
</head>
<body>
<main>
  <img src="/.gladios/mascot" width="220" height="241" alt="">
  <h1>Checking your browser</h1>
  <p>A quick check keeps bots away. It runs about once a week on each device.</p>
  <div class="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span id="status">Working…</span>
  </div>
  <button type="button" class="retry">Try again</button>
  <noscript><p>Turn on JavaScript to continue.</p></noscript>
</main>
<script src="/.gladios/gladios.js" defer></script>
</body>
</html>
